# hanqing — one-command self-hosted deployment.
#
#   cp .env.sample .env          # fill HANQING__TELEGRAM__API_ID / API_HASH
#   docker compose run --rm cli login     # interactive sign-in (starts db first)
#   docker compose up -d daemon           # archive!
#
# Session lives in Postgres; media files go to S3 (HANQING__S3__*). Both
# survive restarts and image rebuilds.
#
# Internal DB credentials default to hanqing/hanqing/hanqing (db is not
# published to the host); set POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# in .env to override them everywhere at once. Note: these only take effect on
# first init of the pgdata volume.

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
      target: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanqing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hanqing}
      POSTGRES_DB: ${POSTGRES_DB:-hanqing}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["migration", "up"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hanqing}:${POSTGRES_PASSWORD:-hanqing}@db:5432/${POSTGRES_DB:-hanqing}
      HANQING__DATABASE__URL: postgres://${POSTGRES_USER:-hanqing}:${POSTGRES_PASSWORD:-hanqing}@db:5432/${POSTGRES_DB:-hanqing}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  daemon:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["hanqing"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hanqing}:${POSTGRES_PASSWORD:-hanqing}@db:5432/${POSTGRES_DB:-hanqing}
      HANQING__DATABASE__URL: postgres://${POSTGRES_USER:-hanqing}:${POSTGRES_PASSWORD:-hanqing}@db:5432/${POSTGRES_DB:-hanqing}
      RUST_LOG: ${RUST_LOG:-info,hanqing=debug}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # On-demand utility: `docker compose run --rm cli login|settings|chats ...`
  # (no profile: `up -d` would start it once and it exits immediately — set
  # profiles if that noise bothers you)
  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["hanqing-cli"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hanqing}:${POSTGRES_PASSWORD:-hanqing}@db:5432/${POSTGRES_DB:-hanqing}
      HANQING__DATABASE__URL: postgres://${POSTGRES_USER:-hanqing}:${POSTGRES_PASSWORD:-hanqing}@db:5432/${POSTGRES_DB:-hanqing}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
