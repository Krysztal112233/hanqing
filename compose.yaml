# hanqing — one-command self-hosted deployment.
#
#   cp .env.sample .env          # fill HANQING__TELEGRAM__API_ID / API_HASH
#   docker compose run --rm cli login     # interactive sign-in (starts db first)
#   docker compose up -d                  # archive + embedding!
#
# Session lives in Postgres; media files go to S3 (HANQING__S3__*). Both
# survive restarts and image rebuilds.
#
# .env must set POSTGRES_* for Docker/Podman Compose compatibility.
# Credentials apply only on the first pgdata volume initialization.

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
      target: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["hanqing-cli", "migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HANQING__DATABASE__URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  daemon:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["hanqing"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HANQING__DATABASE__URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HANQING__EMBEDDING__BASE_URL: http://embed:8080/v1
      HANQING__EMBEDDING__MODEL: Qwen/Qwen3-Embedding-0.6B
      RUST_LOG: ${RUST_LOG:-info,hanqing=debug}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # On-demand CLI: `docker compose run --rm cli login|settings|chats ...`
  cli:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["hanqing-cli"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HANQING__DATABASE__URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # CPU Qwen3 embedding server; first start downloads from Hugging Face.
  # embed-models caches downloads; daemon calls the OpenAI /v1/embeddings API.
  embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    environment:
      LLAMA_CACHE: /models
    command:
      - --hf-repo
      - Qwen/Qwen3-Embedding-0.6B-GGUF
      - --hf-file
      - Qwen3-Embedding-0.6B-Q8_0.gguf
      # Match HANQING__EMBEDDING__MODEL in the daemon environment.
      - --alias
      - Qwen/Qwen3-Embedding-0.6B
      - --embeddings
      - --pooling
      - last # Qwen3-Embedding is a last-token-pooling model
      - --ctx-size
      - "8192"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - embed-models:/models
    # no host port: only reached from other services at http://embed:8080/v1
    restart: unless-stopped

volumes:
  pgdata:
  embed-models:
