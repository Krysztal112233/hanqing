# hanqing — one-command self-hosted deployment.
#
# For an existing external PostgreSQL deployment, use a local (uncommitted)
# compose.runtime.yaml instead: it runs only daemon + embedding, against
# HANQING__DATABASE__URL.
#
#   cp .env.sample .env          # fill HANQING__TELEGRAM__API_ID / API_HASH
#   docker compose run --rm cli login     # interactive sign-in (starts db first)
#   docker compose up -d daemon           # archive!
#
# Session lives in Postgres; media files go to S3 (HANQING__S3__*). Both
# survive restarts and image rebuilds.
#
# .env must set POSTGRES_* for Docker/Podman Compose compatibility.
# Credentials apply only on the first pgdata volume initialization.

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
      target: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["hanqing-cli", "migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HANQING__DATABASE__URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  daemon:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["hanqing"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HANQING__DATABASE__URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RUST_LOG: ${RUST_LOG:-info,hanqing=debug}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # On-demand utility: `docker compose run --rm cli login|settings|chats ...`
  # (no profile: `up -d` would start it once and it exits immediately — set
  # profiles if that noise bothers you)
  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["hanqing-cli"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HANQING__DATABASE__URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Semantic-search embedding service (opt-in; the daemon runs fine without
  # it). Qwen3-Embedding-0.6B on llama.cpp, OpenAI-compatible endpoint.
  #
  # One-time model download into the volume:
  #   docker compose run --rm --entrypoint sh embed -c \
  #     'curl -L -o /models/Qwen3-Embedding-0.6B-Q8_0.gguf \
  #      https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf'
  #
  # GPU hosts: switch to the server-cuda image + NVIDIA container toolkit
  # (CDI) and add -ngl 99 to offload layers; CPU is the default because it
  # works everywhere (slow for bulk backfill, fine for incremental load).
  # Point the daemon at it via HANQING__EMBEDDING__BASE_URL=http://embed:8080/v1
  # (+ HANQING__EMBEDDING__MODEL=Qwen/Qwen3-Embedding-0.6B).
  # The client appends `/embeddings`; include the API version segment.
  embed:
    profiles: ["embed"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --model
      - /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      # Match HANQING__EMBEDDING__MODEL in the daemon environment.
      - --alias
      - Qwen/Qwen3-Embedding-0.6B
      - --embeddings
      - --pooling
      - last # Qwen3-Embedding is a last-token-pooling model
      - --ctx-size
      - "8192"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - embed-models:/models
    # no host port: only reached from other services at http://embed:8080/v1
    restart: unless-stopped

volumes:
  pgdata:
  embed-models:
